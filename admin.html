<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องครู · รู้หนังสือไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm teacher's workbench
   IDEA: a recording sheet — one line per word, record, listen, save
   PICTURE: the list itself, with a live recording row
   COLOUR and TYPE: same blue band, sun yellow and red as the learner app; K2D
   LAYOUT: setup strip, group chips + search, then the recording list */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10142a);--ink:light-dark(#14183a,#eef0ff);--blue:light-dark(#1f3fc4,#4a66f2);--sun:#ffc53d;--red:light-dark(#d9302a,#ff6a5f);--card:light-dark(#f2f4ff,#1a2044);--line:light-dark(#dce1f6,#2d3566);--muted:light-dark(#4b5274,#aab1d6);--ok:light-dark(#1f7a4a,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 K2D,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
header{background:var(--blue);color:#fff}
h1,h2{font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(30px,4.5vw,44px)}
h2{font-size:22px;margin-bottom:8px}
header p{margin:6px 0 0;opacity:.92}
header a{color:#fff}
button,input{font:inherit;color:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.rec{background:var(--red)}
.btn.sun{background:var(--sun);color:#14183a}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.setup{background:var(--card);border-radius:20px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setup label{display:block;font-weight:600;margin-bottom:4px}
.setup input{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:44px}
.msg{grid-column:1/-1;margin:0;font-size:15px}
.msg.bad{color:var(--red)}.msg.good{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:44px;font-size:16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 200px;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:44px}
.prog{display:flex;align-items:center;gap:12px;margin:6px 0 16px;color:var(--muted);font-size:15px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.row.busy{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.say{font-size:28px;font-weight:700;line-height:1.3}
.hint{font-size:14px;color:var(--muted)}
.st{display:inline-block;font-size:13px;border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle;font-weight:600}
.st.human{background:#cfeedd;color:#14532d}.st.synth{background:var(--card);color:var(--muted);border:1px solid var(--line)}.st.new{background:#ffe7a3;color:#5a4200}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.acts audio{height:40px;max-width:220px}
.timer{font-variant-numeric:tabular-nums;color:var(--red);font-weight:700;align-self:center}
.rmsg{grid-column:1/-1;font-size:15px;margin:0}.rmsg.bad{color:var(--red)}.rmsg.good{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,640px);background:#14183a;color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9;font-size:16px}.toast.bad{background:#b3261e}.toast.good{background:#1f7a4a}
.empty{color:var(--muted);text-align:center;padding:30px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:15px;text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:700px){.row{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}.setup{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <h1>ห้องครู · เสียงอ่าน</h1>
  <p>อัดเสียงหรืออัปโหลดไฟล์เสียงคนอ่านจริง แทนเสียงสังเคราะห์ในแอป (เก็บใน Firebase) <a href="index.html">กลับไปหน้าผู้เรียน</a></p>
</div></header>

<main class="band"><div class="wrap">
  <div class="setup" id="login">
    <div class="two">
      <div><label for="em">อีเมลครู</label><input id="em" type="email" autocomplete="username" placeholder="teacher@gmail.com"></div>
      <div><label for="pw">รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password"></div>
    </div>
    <button class="btn" id="signin">เข้าสู่ระบบ</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </div>
  <div class="setup" id="who" hidden>
    <div><b>เข้าสู่ระบบแล้ว:</b> <span id="whoEmail"></span></div>
    <button class="btn alt" id="signout">ออกจากระบบ</button>
    <p class="msg" id="msg2" aria-live="polite"></p>
  </div>
  <div class="tools" id="groups"></div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="ค้นหาคำ เช่น ไก่ หรือ สระอา">
    <button class="chip" id="onlyMissing" aria-pressed="false">เฉพาะที่ยังไม่มีเสียงคน</button>
    <button class="btn sun" id="saveAll" hidden>บันทึกทั้งหมดที่ค้าง</button>
  </div>
  <div class="prog"><span id="progText"></span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
  <div class="list" id="list"></div>
</div></main>
<footer class="band">สร้างสรรค์ โดย นายวนศาสตร์ วัฒนาสกุลลี</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept="audio/*" class="vh" tabindex="-1">

<script src="config.js"></script>
<script src="audio/core.js"></script>

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
function fbErr(e){
  const c=e&&e.code||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-email'))return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if(c.includes('too-many-requests'))return 'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';
  if(c.includes('permission-denied'))return 'บัญชีนี้ไม่มีสิทธิ์แก้ไขเสียง ตรวจอีเมลในกฎ Firestore (README ขั้นที่ 2.5)';
  if(c.includes('network')||c.includes('unavailable'))return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้';
  if(c==='timeout')return 'รอนานเกินไป ตรวจว่าสร้าง Firestore Database แล้ว (README ขั้น 2.2) และอินเทอร์เน็ตใช้ได้';
  if(c.includes('not-found'))return 'ไม่พบฐานข้อมูล Firestore ตรวจว่าสร้าง Firestore Database แล้ว (README ขั้น 2.2)';
  if(c.includes('invalid-argument')||c.includes('resource-exhausted'))return 'ไฟล์เสียงใหญ่เกินไป อัดหรือตัดให้สั้นลง';
  return ((e&&e.message)||'เกิดข้อผิดพลาด')+(c?' ('+c+')':'');
}

async function initFirebase(){
  if(!CFG.apiKey||!CFG.projectId){msg('ยังไม่ได้ใส่ค่า Firebase ในไฟล์ config.js (ดู README.md ขั้นที่ 2) ตอนนี้ฟังได้เฉพาะเสียงสังเคราะห์','bad');return}
  const [app,fs,au]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js'),import(SDK+'firebase-auth.js')]);
  const a=app.initializeApp(CFG);
  fb={fs,au,db:fs.getFirestore(a),auth:au.getAuth(a)};
  au.onAuthStateChanged(fb.auth,u=>{
    authed=!!u;$('#login').hidden=authed;$('#who').hidden=!authed;
    $('#whoEmail').textContent=u?u.email:'';
    if(u)msg('อัดเสียงหรืออัปโหลดไฟล์ได้เลย','good');
    render();
  });
  await loadIndex();
}
async function loadIndex(){
  const {fs,db}=fb;
  const s=await fs.getDoc(fs.doc(db,'meta','index'));
  for(const k in REC)delete REC[k];
  Object.assign(REC,(s.exists()&&s.data().keys)||{});
  render();
}
initFirebase().catch(e=>msg('เชื่อมต่อ Firebase ไม่ได้: '+fbErr(e),'bad'));

$('#signin').onclick=()=>{
  if(!fb){msg('ยังเชื่อมต่อ Firebase ไม่ได้ ตรวจไฟล์ config.js','bad');return}
  msg('กำลังเข้าสู่ระบบ…');
  fb.au.signInWithEmailAndPassword(fb.auth,$('#em').value.trim(),$('#pw').value).catch(e=>msg(fbErr(e),'bad'));
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#signin').click()});
$('#signout').onclick=()=>fb&&fb.au.signOut(fb.auth);

/* ---------- playback ---------- */
const player=new Audio();
function b64url(b,mime){const bin=atob(b),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u8],{type:mime}))}
const recCache={};
function go(u){player.pause();player.src=u;player.play().catch(()=>{})}
function play(key){
  if(pending[key])return go(pending[key].url);
  if(REC[key]&&fb){
    if(recCache[key])return go(recCache[key]);
    fb.fs.getDoc(fb.fs.doc(fb.db,'voices',key)).then(s=>{if(s.exists()){const d=s.data();go(recCache[key]=b64url(d.b64,d.mime||'audio/webm'))}}).catch(e=>msg(fbErr(e),'bad'));
    return;
  }
  if(CORE[key])go('data:audio/mpeg;base64,'+CORE[key]);
}

/* ---------- recording ---------- */
function pickMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];if(!window.MediaRecorder)return '';return c.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||''}
async function startRec(key){
  if(recState)stopRec();
  if(!navigator.mediaDevices||!window.MediaRecorder){msg('เบราว์เซอร์นี้อัดเสียงไม่ได้ ใช้ปุ่ม "อัปโหลดไฟล์" แทน','bad');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){msg('ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กดอนุญาตที่แถบที่อยู่ของเบราว์เซอร์แล้วลองใหม่','bad');return}
  const mime=pickMime();const opt={audioBitsPerSecond:48000};if(mime)opt.mimeType=mime;
  const mr=new MediaRecorder(stream,opt);const chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});setPending(key,blob);recState=null;busyKey=null;render();go(pending[key].url)};
  const t0=Date.now();recState={key,mr,timer:setInterval(()=>{const el=document.querySelector('.timer');if(el)el.textContent=((Date.now()-t0)/1000).toFixed(1)+' วิ';if(Date.now()-t0>15000)stopRec()},100)};
  busyKey=key;mr.start();render();
}
function stopRec(){if(!recState)return;clearInterval(recState.timer);if(recState.mr.state!=='inactive')recState.mr.stop()}
function setPending(key,blob){delete rowMsg[key];if(pending[key])URL.revokeObjectURL(pending[key].url);pending[key]={blob,url:URL.createObjectURL(blob)}}
let fileKey=null;
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!fileKey)return;
  if(f.size>700*1024){msg('ไฟล์ใหญ่เกิน 700 KB ตัดให้สั้นลง หรือใช้ปุ่ม "อัดเสียง" แทน','bad');return}
  if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|wav|ogg|webm|aac)$/i.test(f.name)){msg('เลือกได้เฉพาะไฟล์เสียง','bad');return}
  setPending(fileKey,f);render();go(pending[fileKey].url)};

/* ---------- save / delete ---------- */
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function save(key,quiet){
  const p=pending[key];if(!p||!fb)return false;
  if(!authed){rowMsg[key]={t:'เข้าสู่ระบบก่อนบันทึก',c:'bad'};render();return false}
  busyKey=key;delete rowMsg[key];render();
  let ok=false;
  try{
    const b64=await toB64(p.blob);
    if(b64.length>MAX_B64)throw {code:'too-big'};
    const {fs,db}=fb,t=Date.now();
    await withTimeout(fs.setDoc(fs.doc(db,'voices',key),{b64,mime:p.blob.type||'audio/webm',updated:t}),25000);
    await withTimeout(fs.setDoc(fs.doc(db,'meta','index'),{keys:{[key]:t}},{merge:true}),25000);
    REC[key]=t;recCache[key]=p.url;delete pending[key];rowMsg[key]={t:'บันทึกแล้ว',c:'good'};ok=true;
    if(!quiet)toast('บันทึกเสียง "'+key+'" แล้ว','good');
  }catch(e){
    const t=e&&e.code==='too-big'?'เสียงยาวหรือไฟล์ใหญ่เกินไป (เกินประมาณ 700 KB) อัดหรือตัดให้สั้นลง':fbErr(e);
    rowMsg[key]={t:'บันทึกไม่สำเร็จ: '+t,c:'bad'};if(!quiet)toast('บันทึกไม่สำเร็จ: '+t,'bad');
  }
  busyKey=null;render();return ok;
}
$('#saveAll').onclick=async()=>{
  const ks=Object.keys(pending);let n=0;
  for(const k of ks){if(await save(k,true))n++;else{toast('บันทึกได้ '+n+' จาก '+ks.length+' รายการ หยุดที่ "'+k+'": '+rowMsg[k].t,'bad');return}}
  toast('บันทึกครบ '+n+' รายการแล้ว','good');
};
async function del(key){
  if(!fb)return;busyKey=key;render();
  try{
    const {fs,db}=fb;
    await fs.deleteDoc(fs.doc(db,'voices',key));
    await fs.updateDoc(fs.doc(db,'meta','index'),new fs.FieldPath('keys',key),fs.deleteField());
    delete REC[key];delete recCache[key];msg('ลบเสียงคน "'+key+'" แล้ว แอปจะกลับไปใช้เสียงสังเคราะห์','good');
  }catch(e){msg('ลบไม่สำเร็จ: '+fbErr(e),'bad')}
  busyKey=null;render();
}

/* ---------- render ---------- */
function rowHTML(it){
  const k=it.key,rec=recState&&recState.key===k,busy=busyKey===k&&!rec,p=pending[k];
  const st=p?'<span class="st new">ยังไม่บันทึก</span>':REC[k]?'<span class="st human">เสียงคน</span>':'<span class="st synth">เสียงสังเคราะห์</span>';
  const hint=it.label!==k?`<div class="hint">อ่านว่า: ${esc(k)}</div>`:'';
  const dis=authed?'':'disabled title="เข้าสู่ระบบก่อน"';
  let acts;
  if(rec)acts=`<span class="timer">0.0 วิ</span><button class="btn rec" data-a="stop">หยุดอัด</button>`;
  else if(busy)acts=`<span class="hint">กำลังบันทึก…</span>`;
  else{
    acts=`<button class="btn alt" data-a="play">ฟัง</button><button class="btn rec" data-a="rec" ${dis}>อัดเสียง</button><button class="btn alt" data-a="file" ${dis}>อัปโหลดไฟล์</button>`;
    if(p)acts+=`<button class="btn sun" data-a="save" ${dis}>บันทึก</button><button class="btn alt" data-a="cancel">ยกเลิก</button>`;
    else if(REC[k]&&authed)acts+=`<button class="btn alt" data-a="del">ลบเสียงคน</button>`;
  }
  const rm=rowMsg[k]?`<p class="rmsg ${rowMsg[k].c}">${esc(rowMsg[k].t)}</p>`:'';
  return `<div class="row${rec?' busy':''}" data-k="${esc(k)}"><div><span class="say">${esc(it.label)}</span>${st}${hint}</div><div class="acts">${acts}</div>${rm}</div>`;
}
function render(){
  $('#groups').innerHTML=['ทั้งหมด',...GROUPS.map(g=>g[0])].map((g,i)=>{const n=i?GROUPS[i-1][1].length:ALL.length;return `<button class="chip" data-g="${i}" aria-pressed="${group===i}">${g} (${n})</button>`}).join('');
  const q=$('#q').value.trim(),only=$('#onlyMissing').getAttribute('aria-pressed')==='true';
  const items=ALL.filter(it=>(!group||it.g===GROUPS[group-1][0])&&(!q||it.label.includes(q)||it.key.includes(q))&&(!only||!REC[it.key]));
  $('#list').innerHTML=items.length?items.map(rowHTML).join(''):'<p class="empty">ไม่พบรายการ</p>';
  const np=Object.keys(pending).length;$('#saveAll').hidden=!np||!authed;$('#saveAll').textContent='บันทึกทั้งหมดที่ค้าง ('+np+')';
  const done=ALL.filter(it=>REC[it.key]).length;
  $('#progText').textContent=`มีเสียงคนแล้ว ${done} จาก ${ALL.length} รายการ`;$('#progBar').style.width=(done/ALL.length*100)+'%';
}
$('#groups').onclick=e=>{const b=e.target.closest('[data-g]');if(b){group=+b.dataset.g;render()}};
$('#q').oninput=render;
$('#onlyMissing').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');render()};
$('#list').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const k=b.closest('[data-k]').dataset.k,a=b.dataset.a;
  if(a==='play')play(k);else if(a==='rec')startRec(k);else if(a==='stop')stopRec();
  else if(a==='file'){fileKey=k;$('#file').click()}else if(a==='save')save(k);
  else if(a==='cancel'){URL.revokeObjectURL(pending[k].url);delete pending[k];delete rowMsg[k];render()}
  else if(a==='del')del(k);
};
render();
}

</script>
